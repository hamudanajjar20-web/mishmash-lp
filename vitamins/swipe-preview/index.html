<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>معاينة صور تجارب إضافية</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;800&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff;font-family:Tajawal,sans-serif;color:#023339}
.more{padding:32px 16px 40px;background:#f5f7f9;text-align:center;overflow:hidden}
.more h2{font-family:Alexandria;font-weight:800;font-size:24px;margin:0 0 6px}
.more p{margin:0 0 22px;color:#285257;font-size:15px}
.stack{position:relative;width:min(86vw,380px);aspect-ratio:1;margin:0 auto;touch-action:pan-y}
.card{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 10px 28px rgba(2,51,57,.18);transition:transform .35s ease,opacity .35s ease;will-change:transform;user-select:none}
.card img{width:100%;height:100%;display:block;pointer-events:none}
.ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:22px}
.ctrl button{width:42px;height:42px;border-radius:50%;border:0;background:#023339;color:#ceffff;font-size:20px;cursor:pointer}
.dots{display:flex;gap:6px}.dots i{width:7px;height:7px;border-radius:50%;background:#c9d5d7}.dots i.on{background:#023339;width:18px;border-radius:4px}
.hint{margin-top:12px;font-size:13px;color:#285257}
</style></head><body>
<section class="more"><h2>صور تجارب إضافية</h2><p>نتائج عميلات بعد شهر من ZERO.10</p>
<div class="stack" id="st"></div>
<div class="ctrl"><button id="nx" aria-label="التالي">‹</button><div class="dots" id="dt"></div><button id="pv" aria-label="السابق">›</button></div>
<div class="hint">اسحبي الصورة بإصبعك 👆</div></section>
<script>
(()=>{const n=7,st=document.getElementById('st'),dt=document.getElementById('dt');let order=[...Array(n).keys()],cards=[];
for(let i=0;i<n;i++){const c=document.createElement('div');c.className='card';c.innerHTML='<img src="../img/more/m'+(i+1)+'.webp" alt="قبل وبعد '+(i+1)+'" loading="lazy">';st.appendChild(c);cards.push(c);dt.appendChild(document.createElement('i'))}
function lay(){order.forEach((k,p)=>{const c=cards[k];c.style.zIndex=n-p;c.style.opacity=p>3?0:1;c.style.transform=p?`translateY(${p*10}px) scale(${1-p*.05}) rotate(${p%2?-3:3}deg)`:'none'});[...dt.children].forEach((d,i)=>d.className=i===order[0]?'on':'')}
function go(dir){const top=cards[order[0]];if(dir>0){top.style.transform=`translateX(${-dir*120}%) rotate(${-dir*18}deg)`;setTimeout(()=>{order.push(order.shift());lay()},250)}else{order.unshift(order.pop());lay()}}
let x0=null,dx=0;st.addEventListener('pointerdown',e=>{x0=e.clientX;dx=0;cards[order[0]].style.transition='none';st.setPointerCapture(e.pointerId)});
st.addEventListener('pointermove',e=>{if(x0==null)return;dx=e.clientX-x0;cards[order[0]].style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`});
const end=()=>{if(x0==null)return;cards[order[0]].style.transition='';x0=null;Math.abs(dx)>60?go(dx<0?1:-1):lay()};st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
document.getElementById('nx').onclick=()=>go(1);document.getElementById('pv').onclick=()=>go(-1);lay()})();
</script></body></html>
